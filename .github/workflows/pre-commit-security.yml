name: Pre-Commit Security Scan
# Mirrors khepra-protocol pre-commit-security.yml
# Scans for secrets, SQL injection, command injection, and log injection patterns.

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  security-scan:
    name: Security Pattern Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Scan for exposed secrets / credentials
        run: |
          echo "🔍 Scanning for exposed secrets..."
          SECRETS=$(grep -rEi "password\s*[:=]\s*['\"][^'\"]{8,}['\"]|secret\s*[:=]\s*['\"][^'\"]{8,}['\"]|api_key\s*[:=]\s*['\"][^'\"]{8,}['\"]" \
            --include="*.go" --include="*.ts" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=vendor \
            pkg/ cmd/ src/ 2>/dev/null | \
            grep -v "// " | grep -v "os.Getenv" | grep -v "process.env" || true)
          if [ -n "$SECRETS" ]; then
            echo "⚠️ Potential hardcoded secrets (manual review required):"
            echo "$SECRETS"
          else
            echo "✅ No obvious hardcoded secrets detected"
          fi

      - name: Scan for log injection (Go — %s with user input)
        run: |
          echo "🔍 Scanning for log injection patterns (Go)..."
          # Detect log.Printf/Sprintf with %s that may accept user input
          LOG_INJECTION=$(grep -rn 'log\.Printf\|log\.Println\|fmt\.Fprintf.*os\.Stderr' \
            --include="*.go" pkg/ cmd/ 2>/dev/null | \
            grep '%s' | grep -v '%q' || true)
          if [ -n "$LOG_INJECTION" ]; then
            echo "⚠️ Potential log injection — use %q instead of %s for user-controlled strings:"
            echo "$LOG_INJECTION"
          else
            echo "✅ No log injection patterns detected"
          fi

      - name: Scan for SQL injection (Go)
        run: |
          echo "🔍 Scanning for SQL injection patterns..."
          SQL_INJECTION=$(grep -rn "fmt\.Sprintf.*SELECT\|fmt\.Sprintf.*INSERT\|fmt\.Sprintf.*UPDATE\|fmt\.Sprintf.*DELETE" \
            --include="*.go" pkg/ cmd/ 2>/dev/null || true)
          if [ -n "$SQL_INJECTION" ]; then
            echo "⚠️ Potential SQL injection — use parameterized queries:"
            echo "$SQL_INJECTION"
            exit 1
          else
            echo "✅ No SQL injection patterns detected"
          fi

      - name: Scan for command injection (Go)
        run: |
          echo "🔍 Scanning for command injection patterns..."
          CMD_INJECTION=$(grep -rn "exec\.Command.*fmt\.Sprintf\|exec\.Command.*\+" \
            --include="*.go" pkg/ cmd/ 2>/dev/null || true)
          if [ -n "$CMD_INJECTION" ]; then
            echo "⚠️ Potential command injection — sanitize input before exec.Command:"
            echo "$CMD_INJECTION"
            exit 1
          else
            echo "✅ No command injection patterns detected"
          fi

      - name: Scan for insecure random (Go — math/rand for security)
        run: |
          echo "🔍 Scanning for math/rand in crypto contexts..."
          INSECURE_RAND=$(grep -rn '"math/rand"' \
            --include="*.go" pkg/ cmd/ 2>/dev/null | \
            grep -v "_test.go" || true)
          if [ -n "$INSECURE_RAND" ]; then
            echo "⚠️ math/rand imported in production Go code — use crypto/rand for security:"
            echo "$INSECURE_RAND"
          else
            echo "✅ No insecure math/rand in production code"
          fi

      - name: Scan for path traversal risk (Go)
        run: |
          echo "🔍 Scanning for potential path traversal..."
          PATH_TRAVERSAL=$(grep -rn 'filepath\.Join\|os\.Open' \
            --include="*.go" pkg/ cmd/ 2>/dev/null | \
            grep -v "filepath\.Clean\|HasPrefix\|_test\.go" | head -20 || true)
          if [ -n "$PATH_TRAVERSAL" ]; then
            echo "⚠️ File ops without explicit path confinement check (manual review):"
            echo "$PATH_TRAVERSAL"
          else
            echo "✅ Path operations appear to use confinement checks"
          fi

      - name: Security scan summary
        if: always()
        run: |
          echo ""
          echo "✅ Pre-commit security pattern scan complete"
          echo "Note: These are heuristic checks. CodeQL SAST provides deeper analysis."
