name: Pre-Commit Security Scan

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan-gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan-grep:
    name: Pattern Grep (belt-and-suspenders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for hardcoded credentials in source files..."
          SECRETS=$(grep -rEi \
            "(password|secret|api_key|private_key|auth_token)\s*[:=]+\s*['\"][^'\"]{8,}" \
            --include="*.go" --include="*.ts" --include="*.js" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude="exposed_secrets.go" \
            . 2>/dev/null | \
            grep -v "^\s*//" | grep -v "PLACEHOLDER" | grep -v "REDACTED" \
            || true)

          if [ -n "$SECRETS" ]; then
            echo "FAIL: Potential hardcoded secrets detected:"
            echo "$SECRETS"
            exit 1
          fi
          echo "OK: No hardcoded credentials found"

  dockerfile-secrets:
    name: Dockerfile Secret Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfiles for hardcoded secrets
        run: |
          echo "Scanning Dockerfiles for secrets..."
          for df in Dockerfile Dockerfile.*; do
            if [ -f "$df" ]; then
              if grep -qiE "(password|secret|api_key|token)\s*=\s*['\"]?[a-zA-Z0-9+/]{16,}" "$df" 2>/dev/null; then
                echo "FAIL: Potential secret in $df"
                exit 1
              fi
            fi
          done
          echo "OK: No secrets in Dockerfiles"
