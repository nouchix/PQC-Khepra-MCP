name: SAST + Secret Scan + Supply Chain
# Mirrors khepra-protocol security posture:
#   - CodeQL SAST (Go + TypeScript)
#   - TruffleHog secret scanning
#   - govulncheck (Go module CVE scan)
#   - SLSA provenance + cosign image signing (on release tags)

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"   # Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. CodeQL SAST ────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"

  # ── 2. TruffleHog Secret Scan ─────────────────────────────────────────────────
  secret-scan:
    name: TruffleHog — Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── 3. govulncheck — Go module CVE scan ──────────────────────────────────────
  govulncheck:
    name: govulncheck — Go Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go modules for known CVEs
        run: |
          govulncheck ./... 2>&1 | tee govulncheck-report.txt
          if grep -q "^Vulnerability #" govulncheck-report.txt; then
            echo "❌ FAIL: govulncheck found exploitable vulnerabilities"
            exit 1
          fi
          echo "✅ PASS: No known Go module vulnerabilities"

      - name: Upload report (90-day C3PAO evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report-${{ github.sha }}
          path: govulncheck-report.txt
          retention-days: 90

  # ── 4. SLSA Provenance + Cosign (on tags only) ────────────────────────────────
  supply-chain:
    name: Supply Chain — SBOM + SLSA L3
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-gomod app \
            -main ./cmd/khepra-mcp \
            -output sbom-cyclonedx.json \
            -json -licenses -std

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom-cyclonedx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign GHCR image (keyless — Sigstore OIDC)
        if: env.GHCR_IMAGE != ''
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/khepra-mcp:${{ github.ref_name }}"
        env:
          GHCR_IMAGE: "ghcr.io/${{ github.repository_owner }}/khepra-mcp"
