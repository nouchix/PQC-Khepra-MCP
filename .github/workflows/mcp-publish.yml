name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  id-token: write   # Required for GitHub OIDC token
  contents: read

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate server.json
        run: |
          npx --yes @modelcontextprotocol/mcp-publisher validate server.json

      - name: Publish to Official MCP Registry
        run: |
          npx --yes @modelcontextprotocol/mcp-publisher publish server.json
        env:
          # GitHub OIDC is used automatically — no secret needed.
          # DNS-based auth requires nouchix.com TXT record (see docs/MCP_REGISTRY.md).
          MCP_REGISTRY_URL: https://registry.modelcontextprotocol.io
