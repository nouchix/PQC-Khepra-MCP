name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  id-token: write   # Required for GitHub OIDC token
  contents: read

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          # Install the official MCP publisher CLI
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher-linux-amd64 \
            -o /usr/local/bin/mcp-publisher
          chmod +x /usr/local/bin/mcp-publisher

      - name: Validate server.json
        run: |
          mcp-publisher validate server.json

      - name: Publish to Official MCP Registry
        run: |
          mcp-publisher publish server.json
        env:
          # GitHub OIDC is used automatically — no secret needed.
          # DNS-based auth requires nouchix.com TXT record (see docs/MCP_REGISTRY.md).
          MCP_REGISTRY_URL: https://registry.modelcontextprotocol.io
