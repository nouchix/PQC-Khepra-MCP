name: OWASP ZAP — DAST Security Scan
# OWASP SDLC Phase: Verification
# Tool: OWASP ZAP (Zed Attack Proxy) — Dynamic Application Security Testing
# Reference: OWASP WSTG, OWASP API Top 10
# Covers: A1 Injection, A2 Broken Auth, A3 Sensitive Data, A5 Security Misconfig,
#         A7 XSS, API1-API10 OWASP API Security Top 10

on:
  push:
    branches: [main]
  schedule:
    # Weekly DAST scan — Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL for ZAP scan (default: staging)"
        required: false
        default: "https://staging.souhimbou.ai"

jobs:
  # ── 1. OWASP ZAP Baseline Scan ───────────────────────────────────────────────
  zap-baseline:
    name: ZAP Baseline — Passive Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - uses: actions/checkout@v7

      - name: Determine target URL
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_url }}" ]; then
            echo "url=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=https://staging.souhimbou.ai" >> $GITHUB_OUTPUT
          fi

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-a -j"   # -a: active scan passively; -j: JSON output
          issue_title: "ZAP Baseline Scan — Security Findings"
          fail_action: false      # Report only (baseline = informational)
          allow_issue_writing: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-report-${{ github.run_id }}
          path: |
            report_json.json
            report_html.html
          retention-days: 30

  # ── 2. OWASP ZAP API Scan (OWASP API Top 10) ────────────────────────────────
  zap-api:
    name: ZAP API Scan — OWASP API Top 10
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - uses: actions/checkout@v7

      - name: ZAP API Scan against OpenAPI spec
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: "https://staging.souhimbou.ai/api"
          # Use server.json or openapi.yaml if available
          format: openapi
          fail_action: false
          cmd_options: "-a"
          issue_title: "ZAP API Scan — API Security Findings"
          allow_issue_writing: true

      - name: Upload API scan report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-api-report-${{ github.run_id }}
          path: |
            report_json.json
            report_html.html
          retention-days: 30

  # ── 3. Secure Headers Check ─────────────────────────────────────────────────
  secure-headers:
    name: Secure Headers Verification
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Install shcheck (OWASP Secure Headers checker)
        run: pip install requests

      - name: Check security headers on staging
        run: |
          python - <<'PYEOF'
          import requests, sys

          target = "https://staging.souhimbou.ai"
          required_headers = {
              "Strict-Transport-Security": "HSTS",
              "X-Content-Type-Options": "nosniff",
              "X-Frame-Options": "Clickjacking protection",
              "Content-Security-Policy": "CSP",
              "Referrer-Policy": "Referrer leakage",
              "Permissions-Policy": "Feature policy",
          }
          forbidden_headers = [
              "Server",
              "X-Powered-By",
              "X-AspNet-Version",
          ]

          try:
              resp = requests.get(target, timeout=30, verify=True)
              headers = {k.lower(): v for k, v in resp.headers.items()}
          except Exception as e:
              print(f"WARNING: Cannot reach {target}: {e}")
              sys.exit(0)  # Don't fail CI if staging is down

          missing = []
          for h, desc in required_headers.items():
              if h.lower() not in headers:
                  missing.append(f"  MISSING: {h} ({desc})")
                  print(f"❌ MISSING: {h} ({desc})")
              else:
                  print(f"✅ PRESENT: {h} = {headers[h.lower()][:80]}")

          exposed = []
          for h in forbidden_headers:
              if h.lower() in headers:
                  exposed.append(f"  EXPOSED: {h} = {headers[h.lower()]}")
                  print(f"⚠️  EXPOSED: {h} = {headers[h.lower()]}")

          if missing or exposed:
              print(f"\nSummary: {len(missing)} missing required headers, {len(exposed)} exposed sensitive headers")
              # Informational only — upgrade to exit-code 1 when headers are enforced
          else:
              print("\n✅ All required security headers present")
          PYEOF
