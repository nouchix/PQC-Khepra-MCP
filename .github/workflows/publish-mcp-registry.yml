name: Publish KHEPRA MCP Registry Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Server/package version to publish"
        required: true
        default: "1.0.0"
      publish_registry:
        description: "Publish server.json to the MCP Registry after pushing OCI image"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Gate: re-run CI checks before any publish action
  ci-gate:
    name: CI Gate (required before publish)
    uses: ./.github/workflows/ci.yml

  build-push-publish:
    name: Build OCI image and optionally publish registry metadata
    runs-on: ubuntu-latest
    needs: [ci-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#mcp-v}"
          fi
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/pqc-khepra-mcp"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Resolved: image=${IMAGE} version=${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push OCI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish to MCP Registry
        if: ${{ inputs.publish_registry == true || startsWith(github.ref, 'refs/tags/mcp-v') }}
        run: |
          echo "Publishing server.json to MCP registry..."
          npx --yes @modelcontextprotocol/mcp-publisher publish
