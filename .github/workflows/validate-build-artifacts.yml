name: Validate Build Artifacts

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'manifest.json'
  push:
    branches: [ main, develop ]
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'manifest.json'

jobs:
  validate-source:
    name: Validate Source Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for hardcoded security keys
        run: |
          echo "🔍 Scanning for hardcoded security keys..."

          HARDCODED_KEYS=$(grep -r "khepra-dev-key\|aaru-realm-key\|aten-realm-key" \
            pkg/ cmd/ 2>/dev/null || true)

          if [ -n "$HARDCODED_KEYS" ]; then
            echo "❌ CRITICAL: Hardcoded security keys detected!"
            echo "$HARDCODED_KEYS"
            exit 1
          fi

          echo "✅ No hardcoded keys found"

      - name: Validate manifest.json is well-formed
        run: |
          python3 -c "
          import json, sys
          with open('manifest.json') as f:
              m = json.load(f)
          tools = m.get('tools', [])
          print(f'OK: manifest.json has {len(tools)} tools')
          names = [t['name'] for t in tools]
          assert 'pqc_stig' in names, 'pqc_stig missing from manifest'
          print('OK: pqc_stig present (community tier)')

          # Verify no tool has target arg (should be scan_path for pqc_stig)
          for t in tools:
              if t['name'] == 'pqc_stig':
                  props = t.get('args_schema', {}).get('properties', {})
                  assert 'scan_path' in props, 'pqc_stig must use scan_path not target'
                  assert 'target' not in props, 'pqc_stig must not use target (OS taxonomy bypass)'
                  print('OK: pqc_stig uses scan_path arg')
          "

      - name: Check no private key material in source
        run: |
          echo "🔍 Checking for accidental private key commits..."
          # Look for PEM private key headers that would be catastrophic if committed
          if grep -r "BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY\|BEGIN EC PRIVATE KEY\|DILITHIUM_PRIV" \
            pkg/ cmd/ --include="*.go" 2>/dev/null | grep -v "_test.go"; then
            echo "❌ CRITICAL: Private key material in source files!"
            exit 1
          fi
          echo "✅ No private key material in source"

      - name: Verify pqc_stig is community tier in gate
        run: |
          echo "🔍 Verifying pqc_stig is gated as TierCommunity..."
          if ! grep -q "pqc_stig.*TierCommunity\|TierCommunity.*pqc_stig" pkg/license/mcp_gate.go 2>/dev/null; then
            # Also check for map entry style: "pqc_stig": TierCommunity
            if ! grep -A1 '"pqc_stig"' pkg/license/mcp_gate.go | grep -q "Community"; then
              echo "❌ pqc_stig is not in TierCommunity — community users cannot access it"
              exit 1
            fi
          fi
          echo "✅ pqc_stig is TierCommunity (free)"

      - name: Summary
        if: success()
        run: |
          echo "✅ All validation checks passed!"
          echo ""
          echo "Validated:"
          echo "  - No hardcoded security keys"
          echo "  - manifest.json well-formed, pqc_stig present"
          echo "  - No private key material in source"
          echo "  - pqc_stig gated as TierCommunity"
