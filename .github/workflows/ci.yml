name: CI â€” Required Gate

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:  # Allows this workflow to be called as a reusable workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # â”€â”€ 1. Python unit tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run pytest
        run: pytest test_adinkhepra.py -v --tb=short --cov=adinkhepra --cov-report=term-missing

  # â”€â”€ 2. Python static analysis â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  python-lint:
    name: Static Analysis (bandit + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analysers
        run: pip install bandit ruff

      - name: bandit â€” security audit
        run: |
          bandit -r adinkhepra.py -ll -f txt
          echo "bandit passed"

      - name: ruff â€” linting
        run: |
          ruff check adinkhepra.py --output-format=github
          echo "ruff passed"

  # â”€â”€ 3. Secret scanning â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # â”€â”€ 4. Dockerfile linting â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  dockerfile-lint:
    name: Dockerfile Lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hadolint â€” Dockerfile (main)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: hadolint â€” Dockerfile.ironbank
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile.ironbank
          failure-threshold: error

      - name: hadolint â€” Dockerfile.fips
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile.fips
          failure-threshold: error

      - name: hadolint â€” Dockerfile.mcp
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile.mcp
          failure-threshold: warning

  # â”€â”€ 5. server.json + MCP label validation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  mcp-schema:
    name: MCP server.json + Label Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate server.json is valid JSON
        run: python -m json.tool server.json > /dev/null && echo "server.json is valid JSON"

      - name: Check required server.json fields
        run: |
          python - <<'EOF'
          import json, sys
          with open("server.json") as f:
              data = json.load(f)
          required = ["name", "version", "description", "vendor"]
          missing = [k for k in required if k not in data]
          if missing:
              print(f"FAIL: server.json missing fields: {missing}")
              sys.exit(1)
          print(f"OK: server.json has all required fields: {required}")
          EOF

      - name: Verify OCI label in Dockerfile
        run: |
          if ! grep -q "io.modelcontextprotocol.server.name" Dockerfile; then
            echo "FAIL: Dockerfile missing required OCI label 'io.modelcontextprotocol.server.name'"
            exit 1
          fi
          echo "OK: OCI label found in Dockerfile"

  # ── 6. Go build ─────────────────────────────────────────────────────────────
  go-build:
    name: Go Build (khepra-mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build khepra-mcp binary
        run: go build -o khepra-mcp ./cmd/khepra-mcp/

      - name: Vet and test safe packages
        run: |
          go vet ./cmd/khepra-mcp/ ./pkg/stig/... ./pkg/license/... ./pkg/mcp/... ./pkg/config/...
          go test -short -count=1 -timeout 60s \
            ./pkg/stig/... \
            ./pkg/license/... \
            ./pkg/config/... \
            ./pkg/mcp/...

  # ── 7. Docker build smoke test ───────────────────────────────────────────────
  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [python-tests, python-lint, secret-scan, dockerfile-lint, mcp-schema, go-build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile (main app — no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ghcr.io/nouchix/pqc-khepra-mcp:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dockerfile.mcp (MCP server — no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          tags: ghcr.io/nouchix/pqc-khepra-mcp:mcp-smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
