name: CI - Required Gate

on:
  push:
    branches: [ main, develop, "feature/**", "ci/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run pytest
        run: pytest test_adinkhepra.py -v --tb=short

  python-lint:
    name: Static Analysis (bandit + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysers
        run: pip install bandit ruff

      - name: bandit - security audit
        run: bandit -r adinkhepra.py -ll -f txt

      - name: ruff - linting
        run: ruff check adinkhepra.py --output-format=github

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog filesystem scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  dockerfile-lint:
    name: Dockerfile Lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hadolint - Dockerfile (main)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: hadolint - Dockerfile.ironbank
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.ironbank
          failure-threshold: error

      - name: hadolint - Dockerfile.fips
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.fips
          failure-threshold: error

      - name: hadolint - Dockerfile.mcp
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.mcp
          failure-threshold: error

  mcp-schema:
    name: MCP server.json + Label Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate server.json is valid JSON
        run: python -m json.tool server.json > /dev/null && echo "server.json is valid JSON"

      - name: Check required server.json fields
        run: |
          python3 - <<'PYEOF'
          import json, sys
          with open("server.json") as f:
              data = json.load(f)
          required = ["name", "version", "description"]
          missing = [k for k in required if k not in data]
          if missing:
              print(f"FAIL: server.json missing fields: {missing}")
              sys.exit(1)
          print(f"OK: server.json has all required fields")
          PYEOF

      - name: Verify OCI label in Dockerfile
        run: |
          if ! grep -q "io.modelcontextprotocol" Dockerfile; then
            echo "FAIL: Dockerfile missing required MCP OCI label"
            exit 1
          fi
          echo "OK: OCI label found in Dockerfile"

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [python-tests, python-lint, secret-scan, dockerfile-lint, mcp-schema]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ghcr.io/nouchix/pqc-khepra-mcp:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
