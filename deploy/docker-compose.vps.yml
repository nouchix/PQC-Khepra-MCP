# deploy/docker-compose.vps.yml — Hostinger VPS (2.24.105.170)
#
# Deploy: cd /opt/khepra && docker compose -f deploy/docker-compose.vps.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - khepra
    restart: unless-stopped
    depends_on:
      - khepra-mcp

  khepra-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - KHEPRA_MODE=edge
      - KHEPRA_NETWORK_POLICY=wan
      - KHEPRA_HTTP_PORT=8080
      - KHEPRA_DATA_DIR=/var/lib/khepra
      - KHEPRA_MANIFEST_PATH=/app/manifest.json
      - MCP_PQC_ENABLED=true
      - KHEPRA_CORS_ORIGINS=https://souhimbou.ai,https://adinkhepra.com,https://smithery.ai
    volumes:
      - khepra-data:/var/lib/khepra
    networks:
      - khepra
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy-data:
  caddy-config:
  khepra-data:

networks:
  khepra:
    driver: bridge
